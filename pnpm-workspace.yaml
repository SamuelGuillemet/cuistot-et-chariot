allowBuilds:
  esbuild: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

permissions:
  '@tanstack/devtools-vite':
    skills: false
  '@tanstack/react-start':
    skills: false
  '@tanstack/react-table':
    skills: false

update:
  githubActions: true
